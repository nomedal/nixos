general {
  disable_loading_bar = true
  grace = 0
  hide_cursor = true
}

background {
  monitor =
  color = rgba(0, 0, 0, 1)
  blur_passes = 0
}

# ASCII clock — updates every second
label {
  monitor =
  text = cmd[update:1000] figlet -f slant $(date +'%H  %M')
  color = rgba(80, 255, 150, 1.0)
  font_size = 14
  font_family = JetBrainsMono Nerd Font Mono
  position = 0, 210
  halign = center
  valign = center
}

# Date
label {
  monitor =
  text = cmd[update:60000] date +'%A, %d %B %Y'
  color = rgba(80, 255, 150, 0.55)
  font_size = 14
  font_family = JetBrainsMono Nerd Font Mono
  position = 0, 90
  halign = center
  valign = center
}

# Separator
label {
  monitor =
  text = ──────────────────────────────
  color = rgba(80, 255, 150, 0.2)
  font_size = 14
  font_family = JetBrainsMono Nerd Font Mono
  position = 0, 20
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 380, 46
  outline_thickness = 1
  dots_size = 0.2
  dots_spacing = 0.25
  dots_center = true
  outer_color = rgba(80, 255, 150, 0.6)
  inner_color = rgba(0, 0, 0, 1)
  font_color = rgba(80, 255, 150, 1.0)
  fade_on_empty = false
  placeholder_text = <span foreground="##50ff96"> password</span>
  check_color = rgba(80, 200, 255, 1.0)
  fail_color = rgba(255, 80, 80, 1.0)
  fail_text = <span foreground="##ff5050"> access denied ($ATTEMPTS)</span>
  capslock_color = rgba(255, 200, 50, 1.0)
  position = 0, -50
  halign = center
  valign = center
}

# Username
label {
  monitor =
  text = cmd[update:0] echo " $USER"
  color = rgba(80, 255, 150, 0.35)
  font_size = 13
  font_family = JetBrainsMono Nerd Font Mono
  position = 0, -115
  halign = center
  valign = center
}

# Power menu separator
label {
  monitor =
  text = ──────────────────────────────
  color = rgba(80, 255, 150, 0.1)
  font_size = 14
  font_family = JetBrainsMono Nerd Font Mono
  position = 0, -158
  halign = center
  valign = center
}

# Power buttons (click to execute — SUPER+CTRL+key also works from keyboard)
label {
  monitor =
  text = [ reboot ]
  color = rgba(80, 255, 150, 0.32)
  font_size = 11
  font_family = JetBrainsMono Nerd Font Mono
  position = -240, -195
  halign = center
  valign = center
  onclick = systemctl reboot
}

label {
  monitor =
  text = [ poweroff ]
  color = rgba(80, 255, 150, 0.32)
  font_size = 11
  font_family = JetBrainsMono Nerd Font Mono
  position = -120, -195
  halign = center
  valign = center
  onclick = systemctl poweroff
}

label {
  monitor =
  text = [ hibernate ]
  color = rgba(80, 255, 150, 0.32)
  font_size = 11
  font_family = JetBrainsMono Nerd Font Mono
  position = 0, -195
  halign = center
  valign = center
  onclick = systemctl hibernate
}

label {
  monitor =
  text = [ sleep ]
  color = rgba(80, 255, 150, 0.32)
  font_size = 11
  font_family = JetBrainsMono Nerd Font Mono
  position = 120, -195
  halign = center
  valign = center
  onclick = systemctl suspend
}

label {
  monitor =
  text = [ logout ]
  color = rgba(80, 255, 150, 0.32)
  font_size = 11
  font_family = JetBrainsMono Nerd Font Mono
  position = 240, -195
  halign = center
  valign = center
  onclick = hyprctl dispatch exit 0
}
